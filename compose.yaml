name: devctl-demo
services:
  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_USER: devctl
      POSTGRES_PASSWORD: devctl-dev-only
      POSTGRES_DB: devctl
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devctl -d devctl']
      interval: 2s
      timeout: 3s
      retries: 45
  keycloak:
    image: devctl-keycloak:26.5.2-demo
    build:
      context: .
      dockerfile: deploy/Keycloak.Dockerfile
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: bootstrap-dev-only
      KC_HOSTNAME: http://127.0.0.1:8081
    ports:
      - '127.0.0.1:8081:8080'
volumes:
  postgres-data:
